<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <text x="24" y="34" font-size="20" font-weight="700" fill="#0f172a">Wireshark Packet Capture Pipeline</text>
  <text x="24" y="56" font-size="13" fill="#64748b">devinlaws50-wq/wireshark-network-traffic-analysis</text>

  <!-- Mac / NIC -->
  <g>
    <rect x="300" y="84" width="400" height="76" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
    <text x="500" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">Devin's Mac — Network Interfaces</text>
    <text x="500" y="134" text-anchor="middle" font-size="12.5" fill="#065f46">Wi-Fi: en0 (real network traffic) · Loopback: lo0 (localhost-only traffic)</text>
    <text x="500" y="151" text-anchor="middle" font-size="11.5" fill="#047857">WireGuard VPN disabled during capture so traffic isn't pre-encrypted</text>
  </g>

  <line x1="500" y1="160" x2="500" y2="196" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Wireshark -->
  <g>
    <rect x="270" y="196" width="460" height="92" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="500" y="226" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">Wireshark</text>
    <text x="500" y="248" text-anchor="middle" font-size="12.5" fill="#4c1d95">Captures in promiscuous mode on the selected interface,</text>
    <text x="500" y="266" text-anchor="middle" font-size="12.5" fill="#4c1d95">decodes every layer, applies display filters, exports .pcapng</text>
  </g>

  <!-- connectors down to 4 exercises -->
  <line x1="500" y1="288" x2="500" y2="310" stroke="#334155" stroke-width="1.5"/>
  <line x1="138" y1="310" x2="862" y2="310" stroke="#334155" stroke-width="1.5"/>
  <line x1="138" y1="310" x2="138" y2="330" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="379" y1="310" x2="379" y2="330" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="621" y1="310" x2="621" y2="330" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="862" y1="310" x2="862" y2="330" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 4 exercise boxes -->
  <g>
    <rect x="18" y="330" width="240" height="176" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="138" y="358" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">A — DNS Lookup</text>
    <text x="138" y="380" text-anchor="middle" font-size="11.5" fill="#92400e">nslookup google.com</text>
    <text x="138" y="398" text-anchor="middle" font-size="11.5" fill="#92400e">filter: dns</text>
    <text x="138" y="420" text-anchor="middle" font-size="11.5" fill="#78716c">Query (0xfdc9) and response</text>
    <text x="138" y="436" text-anchor="middle" font-size="11.5" fill="#78716c">share a transaction ID; the</text>
    <text x="138" y="452" text-anchor="middle" font-size="11.5" fill="#78716c">A record resolves to an IPv4</text>
    <text x="138" y="468" text-anchor="middle" font-size="11.5" fill="#78716c">address before any connection</text>
    <text x="138" y="484" text-anchor="middle" font-size="11.5" fill="#78716c">is even opened</text>
    <text x="138" y="500" text-anchor="middle" font-size="11" font-weight="600" fill="#b45309">interface: en0</text>
  </g>

  <g>
    <rect x="259" y="330" width="240" height="176" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="379" y="358" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">B — TCP Handshake</text>
    <text x="379" y="380" text-anchor="middle" font-size="11.5" fill="#92400e">browse to example.com</text>
    <text x="379" y="398" text-anchor="middle" font-size="11.5" fill="#92400e">filter: tcp and ip.addr==...</text>
    <text x="379" y="420" text-anchor="middle" font-size="11.5" fill="#78716c">SYN -&gt; SYN-ACK -&gt; ACK opens</text>
    <text x="379" y="436" text-anchor="middle" font-size="11.5" fill="#78716c">the connection before any</text>
    <text x="379" y="452" text-anchor="middle" font-size="11.5" fill="#78716c">data (or TLS) flows; browser</text>
    <text x="379" y="468" text-anchor="middle" font-size="11.5" fill="#78716c">auto-upgraded to port 443</text>
    <text x="379" y="484" text-anchor="middle" font-size="11.5" fill="#78716c">ahead of the TLS handshake</text>
    <text x="379" y="500" text-anchor="middle" font-size="11" font-weight="600" fill="#b45309">interface: en0</text>
  </g>

  <g>
    <rect x="500" y="330" width="242" height="176" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="621" y="358" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">C — Cleartext HTTP</text>
    <text x="621" y="380" text-anchor="middle" font-size="11.5" fill="#92400e">local test login form</text>
    <text x="621" y="398" text-anchor="middle" font-size="11.5" fill="#92400e">filter: http.request.method==POST</text>
    <text x="621" y="420" text-anchor="middle" font-size="11.5" fill="#78716c">A self-hosted Python HTTP</text>
    <text x="621" y="436" text-anchor="middle" font-size="11.5" fill="#78716c">server on localhost:8080 shows</text>
    <text x="621" y="452" text-anchor="middle" font-size="11.5" fill="#78716c">the POST body in plaintext —</text>
    <text x="621" y="468" text-anchor="middle" font-size="11.5" fill="#78716c">exactly why HTTPS exists,</text>
    <text x="621" y="484" text-anchor="middle" font-size="11.5" fill="#78716c">tested safely on my own server</text>
    <text x="621" y="500" text-anchor="middle" font-size="11" font-weight="600" fill="#b45309">interface: lo0 (loopback)</text>
  </g>

  <g>
    <rect x="742" y="330" width="240" height="176" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="862" y="358" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">D — Follow TCP Stream</text>
    <text x="862" y="380" text-anchor="middle" font-size="11.5" fill="#92400e">browse to neverssl.com</text>
    <text x="862" y="398" text-anchor="middle" font-size="11.5" fill="#92400e">Follow -&gt; TCP Stream</text>
    <text x="862" y="420" text-anchor="middle" font-size="11.5" fill="#78716c">Reassembles every packet in</text>
    <text x="862" y="436" text-anchor="middle" font-size="11.5" fill="#78716c">the conversation into one</text>
    <text x="862" y="452" text-anchor="middle" font-size="11.5" fill="#78716c">readable exchange — request</text>
    <text x="862" y="468" text-anchor="middle" font-size="11.5" fill="#78716c">in red, response in blue — the</text>
    <text x="862" y="484" text-anchor="middle" font-size="11.5" fill="#78716c">core move in incident response</text>
    <text x="862" y="500" text-anchor="middle" font-size="11" font-weight="600" fill="#b45309">interface: en0</text>
  </g>

  <!-- output row -->
  <line x1="138" y1="506" x2="138" y2="528" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="379" y1="506" x2="379" y2="528" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="621" y1="506" x2="621" y2="528" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="862" y1="506" x2="862" y2="528" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="18" y="528" width="964" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="500" y="552" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">screenshots/ + captures/*.pcapng</text>
  <text x="500" y="572" text-anchor="middle" font-size="11.5" fill="#1e3a8a">Exported evidence for this repo — portfolio proof of each skill demonstrated above</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#334155"/>
    </marker>
  </defs>
</svg>
